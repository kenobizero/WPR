name: Android APK (manual)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Install Android SDK platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Build APK
        run: |
          dotnet build Src/Platforms/WPR.Platform.Android/WPR.Platform.Android.csproj \
            -c Release -f net10.0-android36.0 \
            -p:SolutionDir="$GITHUB_WORKSPACE/Src/" \
            -p:IncludeAndroidTargets=true \
            -p:EmbedAssembliesIntoApk=true \
            -p:AndroidEnableAssemblyCompression=false \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:JavaSdkDirectory="$JAVA_HOME" \
            -t:SignAndroidPackage
      - uses: actions/upload-artifact@v4
        with:
          name: wpr-apk
          path: Src/Platforms/WPR.Platform.Android/bin/**/*-Signed.apk￼Enter
