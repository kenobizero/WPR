name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android workload
        run: |
          dotnet --version
          dotnet workload clean
          # --skip-manifest-update: pakai manifest bawaan SDK 10 supaya versi pack
          # Android (SDK vs runtime) sama, bukan ditarik ke versi 11/37 yang beda.
          dotnet workload install android --skip-manifest-update
          dotnet workload list

      - name: Install Android SDK platform 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36"

      - name: Build APK
        run: |
          dotnet build Src/Platforms/WPR.Platform.Android/WPR.Platform.Android.csproj \
            -c Release -f net10.0-android36.0 \
            -p:SolutionDir="$GITHUB_WORKSPACE/Src/" \
            -p:IncludeAndroidTargets=true \
            -p:EmbedAssembliesIntoApk=true \
            -p:UseMonoRuntime=true \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:JavaSdkDirectory="$JAVA_HOME" \
            "-p:NoWarn=XA0141%3BXA4301" \
            -t:SignAndroidPackage

      - name: List generated APKs
        run: find Src/Platforms/WPR.Platform.Android/bin -name "*.apk"

      - name: Inspect APK (diagnosa FC)
        run: |
          APK=$(find Src/Platforms/WPR.Platform.Android/bin -name "*-Signed.apk" | head -1)
          echo "APK: $APK"; ls -l "$APK"
          mkdir -p /tmp/apkx && unzip -o -q "$APK" 'lib/arm64-v8a/*' -d /tmp/apkx || true
          ls -l /tmp/apkx/lib/arm64-v8a | grep -i "monodroid\|xamarin\|coreclr\|monosgen" || true
          echo "--- libxamarin-app.so mengekspor compressed_assembly_count?"
          nm -D /tmp/apkx/lib/arm64-v8a/libxamarin-app.so 2>&1 | grep -i "compressed_assembly_count" || echo "TIDAK ADA"
          echo "--- pack Android yang terpasang"
          ls /usr/share/dotnet/packs | grep -i "android" || true
          ls /usr/share/dotnet/packs/Microsoft.Android.Sdk.Linux || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wpr-apk
          path: Src/Platforms/WPR.Platform.Android/bin/**/*-Signed.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
